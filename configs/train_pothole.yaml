# Training configuration for the single-class pothole detector (run on Colab).
model: yolov8s.pt            # COCO-pretrained start. Use yolov8n.pt for the speed comparison.
data: configs/dataset_pothole.yaml
imgsz: 640                   # 960 is a worthwhile ablation
epochs: 100
patience: 20
batch: 16
seed: 0
workers: 2
project: runs/pothole
name: yolov8s_640
device: null
cos_lr: false
# Augmentation: road geometry is fixed, so no vertical flip and no rotation.
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
