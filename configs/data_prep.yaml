# Parameters for the data scripts (convert / clean / dedupe / split / frames / agreement).
clean:
  min_box_px: 8              # boxes with width or height below this (pixels) are dropped
  tiny_box_policy: drop_image_if_empty   # drop_box | drop_image_if_empty (avoids creating false negatives)
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
convert:
  keep_negative_ratio: 0.0   # fraction of annotated-but-empty images kept as negatives (0 = none)
  exif_policy: keep          # keep | skip images whose EXIF orientation is not 1 (they are always reported)
dedupe:
  hash_size: 8
  hamming_threshold: 4       # images with perceptual-hash distance <= this share a cluster
splits:
  test_a_source: bucko       # the whole source is held out
  val_fraction: 0.15
  seed: 0
frames:
  interval_seconds: 1.0
  blur_threshold: 60.0       # Laplacian variance below this => frame skipped as blurry
  jpeg_quality: 95
prelabel:
  pothole_conf: 0.25
  mtw_conf: 0.30
  mtw_coco_class_id: 3
  pothole_class: 0
  mtw_class: 1
test_b:
  min_videos: 8
  allowed_class_ids: [0, 1]  # 0 pothole, 1 MTW
  min_box_px: 4
agreement:
  iou_threshold: 0.5
tracking_eval:
  iou_threshold: 0.5
detection_eval:
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  pred_conf_floor: 0.001
  f1_conf_grid_step: 0.01
  gallery_conf: 0.25
  gallery_max: 12
labeling:
  clip_pad_seconds: 1.0
  calibration_fraction: 0.5
  seed: 0
sensitivity:
  perturbation: 0.20
